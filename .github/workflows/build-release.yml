name: Build and Release

# Pushing a tag such as v0.1.0 builds Kumo for macOS (arm64 and amd64) and
# Linux, and uploads the disk images, archives and packages to a draft
# release. mygo.config.ts's version must match the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: go vet ./... && go test ./...
      - run: bun run typecheck
      - run: bun run lint:fsd
      - run: bun run lint:i18n
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^  version: "\(.*\)",/\1/p' mygo.config.ts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "mygo.config.ts says $version, the tag $GITHUB_REF_NAME"; exit 1; }

  draft-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Kumo ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  build:
    needs: [check, draft-release]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ "${{ needs.draft-release.result }}" = success ]; then
            bun run build -- -platform "${{ matrix.platform }}" -upload
          else
            bun run build -- -platform "${{ matrix.platform }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-${{ matrix.name }}
          path: build/
          retention-days: 7
