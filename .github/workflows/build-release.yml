name: Build and Release

# Pushing a tag runs the workflow file stored on that tag. The annotated
# tag v0.1.0 points at 9d299814c3ca6f4d4c937966044d2ec4a8455a97 and does not
# contain this file, so rerunning that failed run repeats its -upload
# error. Dispatch this workflow with ref set to v0.1.0. The job checks out
# that tag and uploads installers to its existing draft. The workflow
# commit is not the app source unless the two SHAs are equal.
#
# mygo build -upload is not used. It stops before compiling unless
# updates.github or updates.s3 is set, and this release leaves updates off.
#
# The tag check is read-only. An exact ls-remote of an annotated tag returns
# only the tag object; the peeled commit is the separate refs/tags/<tag>^{}
# line. The check does not fetch, so a depth-1 checkout's shallow file stays
# untouched. Asset scripts run under the runner's /bin/bash, which is Bash
# 3.2 on macOS, and do not expand empty arrays.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Annotated tag to compile and upload, such as v0.1.0. This is the app source, not the workflow commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test the release asset scripts
        run: bash scripts/release/release_assets_test.sh
      - name: Keep the release scripts
        run: |
          mkdir -p "$RUNNER_TEMP/kumo-release"
          cp scripts/release/assert_release_commit.sh \
            scripts/release/list_release_assets.sh \
            scripts/release/upload_release_assets.sh \
            "$RUNNER_TEMP/kumo-release/"
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
      - name: The checkout is that tag
        id: source
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
        run: bash "$RUNNER_TEMP/kumo-release/assert_release_commit.sh"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: go vet ./... && go test ./...
      - run: bun run typecheck
      - run: bun run lint:fsd
      - run: bun run lint:i18n

  draft-release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Kumo ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  build:
    needs: [check, draft-release]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.draft-release.result == 'success' || needs.draft-release.result == 'skipped') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Keep the release scripts
        run: |
          mkdir -p "$RUNNER_TEMP/kumo-release"
          cp scripts/release/assert_release_commit.sh \
            scripts/release/list_release_assets.sh \
            scripts/release/upload_release_assets.sh \
            "$RUNNER_TEMP/kumo-release/"
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
      - name: The checkout is that tag
        id: source
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
        run: bash "$RUNNER_TEMP/kumo-release/assert_release_commit.sh"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build -- -platform "${{ matrix.platform }}"
      - name: Upload installers to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
        run: bash "$RUNNER_TEMP/kumo-release/upload_release_assets.sh"
      - name: Record provenance
        run: |
          {
            echo "### Source"
            echo "Compiled \`${{ steps.source.outputs.tag }}\` at \`${{ steps.source.outputs.sha }}\`."
            echo "Workflow file commit \`${{ github.sha }}\`. That commit is the app source only when the two SHAs are equal."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-${{ steps.source.outputs.tag }}-${{ matrix.name }}
          path: build/
          retention-days: 7
